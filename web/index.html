<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thesaurus</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { margin-bottom: .2rem; }
  .sub { color: #666; margin-top: 0; }
  form { display: flex; gap: .5rem; margin: 1.5rem 0; }
  input[type=text] { flex: 1; padding: .6rem; font-size: 1.1rem; border: 1px solid #bbb; border-radius: 6px; }
  select, button { padding: .6rem .9rem; font-size: 1rem; border-radius: 6px; border: 1px solid #bbb; background: #fff; cursor: pointer; }
  button.main { background: #2f5fd0; color: #fff; border-color: #2f5fd0; }
  button.small { padding: .15rem .5rem; font-size: .8rem; margin-left: .5rem; }
  button:disabled { opacity: .6; cursor: default; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
  .pos { background: #eef; border-radius: 4px; padding: .1rem .4rem; font-size: .8rem; color: #335; margin-left: .4rem; }
  .freq, .muted { color: #888; font-size: .85rem; margin-left: .4rem; }
  .note { color: #555; font-size: .9rem; }
  .ex { margin: .6rem 0; }
  .ex .en { color: #666; }
  h3 { margin: 0 0 .5rem 0; }
  ul { margin: .3rem 0; padding-left: 1.2rem; }
  hr { border: none; border-top: 1px solid #ddd; margin: 2rem 0 1rem; }
  .head { display: flex; justify-content: space-between; align-items: center; }
  li.nb { margin: .4rem 0; }
  .clip { width: 100%; max-height: 360px; background: #000; border-radius: 8px; margin-top: .5rem; }
  .holder button.small { margin-left: 0; margin-top: .4rem; }
</style>
</head>
<body>
<h1>Thesaurus</h1>
<p class="sub">Dictionnaire FR / EN avec phrases d'exemple</p>
<form id="f">
  <input type="text" id="word" placeholder="Tape un mot..." autofocus required>
  <select id="lang">
    <option value="fr">Français → anglais</option>
    <option value="en">Anglais → français</option>
  </select>
  <button type="submit" class="main">Chercher</button>
</form>
<div id="out"></div>

<hr>
<div class="head">
  <h2 id="nbtitle">Mon carnet</h2> <a href="/review">R&eacute;viser &rarr;</a>
  <select id="filter">
    <option value="all">Tous les mots</option>
    <option value="today">Aujourd'hui</option>
  </select>
</div>
<div id="notebook"></div>

<script>
const USER = "demo";
const POS = { verb: "verbe", noun: "nom", adj: "adjectif", adv: "adverbe",
              name: "nom propre", intj: "interjection", phrase: "expression" };

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined && text !== null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}
function nb(n) { return n.toLocaleString("fr-FR"); }

async function api(path, options) {
  const r = await fetch(path, options);
  if (!r.ok) throw new Error("Erreur " + r.status);
  return r.json();
}
function post(path, body) {
  return api(path, { method: "POST", headers: { "Content-Type": "application/json" },
                     body: JSON.stringify(body) });
}

function saveButton(word, lang, translation) {
  const b = el("button", "+ Carnet", "small");
  b.type = "button";
  b.addEventListener("click", async () => {
    try {
      const r = await post("/usage/words", { user: USER, word: word, lang: lang,
                                             translation: translation.slice(0, 300) });
      b.textContent = r.saved ? "Ajouté ✓" : "Déjà dans le carnet";
      b.disabled = true;
      loadNotebook();
    } catch (err) { b.textContent = "Erreur"; }
  });
  return b;
}

function renderExamples(data) {
  const box = el("div", null, "card");
  box.appendChild(el("h3", "Exemples"));
  if (!data.examples.length) {
    box.appendChild(el("p", "Aucune phrase trouvée.", "muted"));
    return box;
  }
  data.examples.forEach(x => {
    const d = el("div", null, "ex");
    d.appendChild(el("div", x.fr));
    d.appendChild(el("div", x.en, "en"));
    box.appendChild(d);
  });
  box.appendChild(el("p", nb(data.total_examples) + " phrases contiennent ce mot.", "note"));
  return box;
}

function renderFr(data, out) {
  if (data.forms.length) {
    const lemmas = [...new Set(data.forms.map(f => f.lemma))].join(", ");
    out.appendChild(el("p", "« " + data.word + " » est une forme de : " + lemmas, "note"));
  }
  data.entries.forEach(e => {
    const box = el("div", null, "card");
    const h = el("h3", e.word);
    h.appendChild(el("span", POS[e.pos] || e.pos, "pos"));
    h.appendChild(el("span", nb(e.freq) + " phrases", "freq"));
    if (e.translations.length) {
      h.appendChild(saveButton(e.word, "fr", e.translations.slice(0, 3).join("; ")));
    }
    box.appendChild(h);
    const ul = el("ul");
    e.translations.forEach(t => ul.appendChild(el("li", t)));
    box.appendChild(ul);
    out.appendChild(box);
  });
  if (!data.entries.length) out.appendChild(el("p", "Aucune définition trouvée dans le dictionnaire.", "muted"));
}

function renderEn(data, out) {
  const common = data.translations.filter(t => t.freq >= 20);
  const rare = data.translations.filter(t => t.freq < 20);
  const line = t => {
    const li = el("li", t.word);
    li.appendChild(el("span", POS[t.pos] || t.pos, "pos"));
    li.appendChild(el("span", nb(t.freq) + " phrases", "freq"));
    return li;
  };
  const box = el("div", null, "card");
  const h = el("h3", "Traductions");
  const best = (common.length ? common : data.translations).slice(0, 3);
  if (best.length) {
    h.appendChild(saveButton(data.word, "en", best.map(t => t.word).join(", ")));
  }
  box.appendChild(h);
  if (common.length) {
    const ul = el("ul");
    common.forEach(t => ul.appendChild(line(t)));
    box.appendChild(ul);
  } else {
    box.appendChild(el("p", "Aucune traduction courante trouvée.", "muted"));
  }
  if (rare.length) {
    const d = el("details");
    d.appendChild(el("summary", "Moins courants (" + rare.length + ")", "muted"));
    const ul = el("ul");
    rare.forEach(t => ul.appendChild(line(t)));
    d.appendChild(ul);
    box.appendChild(d);
  }
  out.appendChild(box);
}

async function loadNotebook() {
  const box = document.getElementById("notebook");
  const today = document.getElementById("filter").value === "today";
  const day = today ? "&day=" + new Date().toISOString().slice(0, 10) : "";
  try {
    const data = await api("/usage/words?user=" + USER + day);
    document.getElementById("nbtitle").textContent = "Mon carnet (" + data.count + ")";
    box.replaceChildren();
    if (!data.count) {
      box.appendChild(el("p", "Aucun mot pour l'instant.", "muted"));
      return;
    }
    const ul = el("ul");
    data.words.forEach(w => {
      const li = el("li", null, "nb");
      li.appendChild(el("strong", w.word));
      li.appendChild(el("span", " (" + w.lang + ") → " + w.translation));
      const del = el("button", "Supprimer", "small");
      del.type = "button";
      del.addEventListener("click", async () => {
        await api("/usage/words/" + w.id + "?user=" + USER, { method: "DELETE" });
        loadNotebook();
      });
      li.appendChild(del);
      ul.appendChild(li);
    });
    box.appendChild(ul);
  } catch (err) {
    box.replaceChildren(el("p", "Carnet indisponible : " + err.message, "muted"));
  }
}


function fmt(ms) {
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function playClip(holder, x) {
  holder.replaceChildren();
  const v = document.createElement("video");
  v.className = "clip";
  v.controls = true;
  v.preload = "metadata";
  v.src = "/video/" + x.film_id;
  const start = Math.max(0, x.start_ms / 1000 - 0.4);
  const end = x.end_ms / 1000 + 0.4;
  let active = true;
  v.addEventListener("loadedmetadata", () => {
    v.currentTime = start;
    v.play().catch(() => {});
  });
  v.addEventListener("timeupdate", () => {
    if (active && v.currentTime >= end) { v.pause(); active = false; }
  });
  v.addEventListener("error", () => {
    holder.appendChild(el("p", "Vid\u00e9o illisible dans ce navigateur.", "muted"));
  });
  holder.appendChild(v);
  const again = el("button", "Rejouer la sc\u00e8ne", "small");
  again.type = "button";
  again.addEventListener("click", () => {
    active = true;
    v.currentTime = start;
    v.play().catch(() => {});
  });
  holder.appendChild(again);
}

async function loadExcerpts(word, lang, out) {
  try {
    const data = await api("/excerpts?word=" + encodeURIComponent(word) + "&lang=" + lang + "&limit=2");
    if (!data.excerpts.length) return;
    const box = el("div", null, "card");
    box.appendChild(el("h3", "Dans le film"));
    data.excerpts.forEach(x => {
      const d = el("div", null, "ex");
      d.appendChild(el("div", x.fr));
      d.appendChild(el("div", x.en, "en"));
      d.appendChild(el("div", x.film + " - " + fmt(x.start_ms) + " / " + fmt(x.end_ms), "muted"));
      const holder = el("div", null, "holder");
      const btn = el("button", "\u25B6 Voir la sc\u00e8ne", "main small");
      btn.type = "button";
      btn.addEventListener("click", () => playClip(holder, x));
      holder.appendChild(btn);
      d.appendChild(holder);
      box.appendChild(d);
    });
    box.appendChild(el("p", data.credits.join(" | "), "note"));
    out.appendChild(box);
  } catch (err) { }
}

document.getElementById("filter").addEventListener("change", loadNotebook);

document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const word = document.getElementById("word").value.trim();
  const lang = document.getElementById("lang").value;
  const out = document.getElementById("out");
  out.replaceChildren(el("p", "Recherche...", "muted"));
  try {
    const data = await api("/lookup?word=" + encodeURIComponent(word) + "&lang=" + lang);
    out.replaceChildren();
    if (lang === "fr") renderFr(data, out); else renderEn(data, out);
    out.appendChild(renderExamples(data));
    loadExcerpts(word, lang, out);
    const found = lang === "fr" ? data.entries.length > 0 : data.translations.length > 0;
    post("/usage/searches", { user: USER, word: word, lang: lang, found: found }).catch(() => {});
  } catch (err) {
    out.replaceChildren(el("p", "Problème : " + err.message, "muted"));
  }
});

loadNotebook();
</script>
</body>
</html>
